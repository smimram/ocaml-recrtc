<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>recrtc</title>
    <link rel="stylesheet" href="/recrtc.css" />
  </head>
  <body>
    <h1>recrtc</h1>
    <p>Send the microphone, and the camera if you like, to the server over
      WebRTC, and record it there.</p>
    <p>
      <button id="record">Record</button> <span id="state">idle</span>
      <label><input type="checkbox" id="video" checked /> camera</label>
    </p>
    <video id="preview" hidden autoplay muted playsinline width="320"></video>
    <pre id="log"></pre>
    <script src="/recrtc.js"></script>
  </body>
</html>
